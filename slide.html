<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REX héros · slide</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --paint:#f2c400; --sign-black:#141414; --navy:#122a4f;
    --txt:#f6f2e7; --muted:#c3bcad; --lit:#ffd21e;
    --cadrage:#2f74c0; --cadrage-edge:#8fc0f5; --cap:#6bbf73;
    --over:#e0533c; --tada:#2fae66; --bof:#aab0b6;
    --card:rgba(12,22,40,.6); --line:rgba(242,196,0,.22);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{height:100vh;overflow:hidden;color:var(--txt);
    font-family:"Arial Narrow","Roboto Condensed",Arial,system-ui,sans-serif;display:flex;flex-direction:column;
    background:radial-gradient(120% 80% at 82% 4%, rgba(255,210,120,.26), rgba(255,210,120,0) 46%),
      linear-gradient(180deg,#0a1730 0%,#10294d 42%,#1c3350 72%,#243a4a 100%)}
  .scan{position:fixed;inset:0;pointer-events:none;mix-blend-mode:overlay;opacity:.4;
    background:repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 3px, transparent 3px 26px)}
  header{flex:0 0 auto;display:flex;align-items:center;gap:.8rem;z-index:2;
    padding:clamp(.5rem,1.4vh,.9rem) clamp(1rem,3vw,2.4rem);border-bottom:2px solid var(--line)}
  .brand{display:flex;align-items:center;gap:.5rem;font-weight:800;letter-spacing:.04em;font-size:clamp(1.05rem,2.4vh,1.5rem);color:var(--txt);text-decoration:none}
  .brand:hover{color:var(--paint)}
  .brand .ico{width:1.4em;height:1.4em;display:grid;place-items:center;color:var(--sign-black);background:var(--paint);border-radius:7px;font-size:.78em}
  .code{color:var(--sign-black);background:var(--paint);border-radius:6px;font-weight:800;padding:.1em .55em;letter-spacing:.05em;font-size:clamp(1rem,2.3vh,1.4rem)}
  header .right{margin-left:auto;display:flex;gap:.5rem;align-items:center}
  .chip{background:rgba(242,196,0,.14);border:1px solid rgba(242,196,0,.5);color:var(--paint);border-radius:999px;padding:.22em .8em;font-weight:700;letter-spacing:.1em;font-size:clamp(.7rem,1.7vh,1rem)}

  main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1.6fr 1fr;gap:clamp(1rem,2.4vw,2rem);
    padding:clamp(.9rem,2.4vh,1.6rem) clamp(1.2rem,3.2vw,2.6rem);z-index:2}
  .col{min-height:0;display:flex;flex-direction:column;gap:clamp(.6rem,1.6vh,1.1rem)}
  .kicker{color:var(--paint);letter-spacing:.2em;text-transform:uppercase;font-size:clamp(.85rem,1.9vh,1.15rem)}
  h1{margin:0;font-weight:800;line-height:1;font-size:clamp(2.2rem,7vh,4.4rem)}
  .texte{color:#eee8d9;font-size:clamp(1.15rem,2.9vh,1.9rem);line-height:1.42;margin:0}
  .question{color:#fff;font-weight:800;font-size:clamp(1.3rem,3.4vh,2.2rem);margin:.2rem 0 0}
  .why{color:var(--lit);font-weight:700;font-size:clamp(1.15rem,3vh,1.9rem);margin:.2rem 0 0}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(.8rem,1.9vh,1.2rem)}
  .panel h3{margin:0 0 .6rem;font-size:clamp(.85rem,1.8vh,1.1rem);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .gauges{display:flex;flex-direction:column;gap:.6rem}
  .g{display:grid;grid-template-columns:auto 1fr auto;gap:.6rem;align-items:center;font-size:clamp(1rem,2.1vh,1.3rem)}
  .g .nm{color:#dfe8f5} .g .track{display:block;height:12px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .g .fill{display:block;height:100%;border-radius:999px} .g .val{font-weight:800;font-variant-numeric:tabular-nums;min-width:3.4em;text-align:right}
  .g.b .fill{background:var(--paint)} .g.t .fill{background:#57b3a4} .g.s .fill{background:#cf8fb2}
  .explain{color:var(--muted);font-size:clamp(.8rem,1.7vh,1.02rem);line-height:1.45;margin:.6rem 0 0}
  .inv{display:flex;gap:.7rem;margin-top:.8rem}
  .inv .it{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:.6rem;text-align:center}
  .inv .it .n{font-size:clamp(1.6rem,4vh,2.4rem);font-weight:800}
  .inv .it.cap .n{color:var(--cap)} .inv .it.cad .n{color:var(--cadrage-edge)}
  .inv .it .k{font-size:clamp(.66rem,1.5vh,.86rem);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}

  .vote{flex:0 0 auto;z-index:2;display:grid;grid-template-columns:1fr auto;gap:clamp(1rem,2.4vw,2rem);
    align-items:stretch;padding:0 clamp(1.2rem,3.2vw,2.6rem) clamp(.5rem,1.4vh,.9rem)}
  .choix{display:flex;gap:1rem}
  .choice{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:clamp(.8rem,1.8vh,1.2rem);display:flex;flex-direction:column;gap:.6rem;transition:border-color .2s}
  .choice.lead{border-color:var(--lit);box-shadow:0 0 0 2px rgba(255,210,30,.28)}
  .choice .hd{display:flex;align-items:baseline;gap:.6rem}
  .choice .bdg{font-weight:800;color:var(--sign-black);background:var(--paint);border-radius:7px;padding:.05em .5em;font-size:clamp(1.1rem,2.6vh,1.5rem)}
  .choice .lab{font-size:clamp(1.1rem,2.5vh,1.6rem);font-weight:800;line-height:1.12}
  .choice .res{display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:center;margin-top:auto}
  .choice .track{display:block;height:16px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden}
  .choice .fill{display:block;height:100%;width:0;background:var(--lit);border-radius:999px;transition:width .4s}
  .choice .cnt{font-weight:800;font-variant-numeric:tabular-nums;min-width:4em;text-align:right;font-size:clamp(1.05rem,2.4vh,1.45rem)}
  .qrcard{background:#fff;color:#16213a;border-radius:16px;padding:.8rem;display:flex;flex-direction:column;align-items:center;gap:.4rem;min-width:clamp(160px,17vw,210px)}
  #qr{width:clamp(130px,14vw,172px);height:clamp(130px,14vw,172px)}
  #qr img,#qr canvas{width:100%!important;height:100%!important}
  .qrcard .q1{font-weight:800;letter-spacing:.04em;font-size:clamp(.95rem,2vh,1.2rem)}
  .qrcard .q2{font-size:clamp(.78rem,1.6vh,.95rem);color:#55617a;text-align:center;line-height:1.25}
  .qrcard .q2 b{color:#16213a}

  footer{flex:0 0 auto;z-index:2;display:flex;align-items:center;gap:1rem;
    padding:.5rem clamp(1.2rem,3.2vw,2.6rem);border-top:2px solid var(--line);background:rgba(10,15,28,.5)}
  .path{flex:1;min-width:0;color:var(--muted);font-size:clamp(.78rem,1.7vh,1.05rem);letter-spacing:.04em;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  .path b{color:var(--paint)}
  .next{display:inline-flex;align-items:center;gap:.5em;background:var(--paint);color:var(--sign-black);font-weight:800;letter-spacing:.04em;border:none;cursor:pointer;padding:.62em 1.25em;border-radius:12px;font-size:clamp(1.05rem,2.4vh,1.45rem);white-space:nowrap}
  .next:hover{filter:brightness(1.06)}
  .next:disabled{opacity:.45;cursor:not-allowed;filter:none}
  .hint{color:var(--muted);font-size:clamp(.72rem,1.6vh,.98rem);white-space:nowrap}
  kbd{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:.04em .45em}

  /* fin */
  #fin{display:none;flex:1 1 auto;z-index:2;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(.6rem,2vh,1.2rem);padding:2rem}
  #fin .emoji{font-size:clamp(3.4rem,13vh,8rem);line-height:1}
  #fin .ftitre{font-weight:800;font-size:clamp(2rem,7vh,4.4rem);margin:0}
  #fin .flabel{letter-spacing:.3em;text-transform:uppercase;font-weight:800;font-size:clamp(.9rem,2.1vh,1.2rem)}
  #fin .ftxt{max-width:60ch;color:#eee8d9;font-size:clamp(1.15rem,2.8vh,1.7rem);line-height:1.45;margin:.4rem 0 0}
  #fin .acts{display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;margin-top:1rem}
  #fin .btn{display:inline-flex;align-items:center;gap:.5em;font-weight:800;letter-spacing:.04em;text-decoration:none;cursor:pointer;border:2px solid var(--paint);color:var(--paint);background:transparent;padding:.6em 1.2em;border-radius:12px;font-size:clamp(1rem,2.3vh,1.35rem)}
  #fin .btn.primary{background:var(--paint);color:var(--sign-black);border-color:var(--paint)}
  .finover .flabel,.finover .emoji{color:var(--over)} .fintada .flabel,.fintada .emoji{color:var(--tada)} .finbof .flabel,.finbof .emoji{color:var(--bof)}
  @media (max-width:960px){ main{grid-template-columns:1fr} .vote{grid-template-columns:1fr} }
</style>
</head>
<body>
  <div class="scan"></div>
  <header>
    <a class="brand" href="/slides"><span class="ico">✈</span> REX HÉROS</a>
    <span class="code" id="code">S0</span>
    <span class="right"><span class="chip">4SHARE MORNING</span></span>
  </header>

  <main id="main">
    <div class="col">
      <div class="kicker" id="kicker"></div>
      <h1 id="titre"></h1>
      <p class="texte" id="texte"></p>
      <p class="question" id="question"></p>
      <p class="why" id="why" style="display:none"></p>
    </div>
    <div class="col">
      <div class="panel">
        <h3>Jauges du projet</h3>
        <div class="gauges" id="gauges"></div>
        <p class="explain" id="explain"></p>
      </div>
      <div class="panel">
        <h3>Inventaire</h3>
        <div class="inv">
          <div class="it cad"><div class="n" id="inv-cad">0</div><div class="k">Points de cadrage</div></div>
          <div class="it cap"><div class="n" id="inv-cap">0</div><div class="k">Changements de cap</div></div>
        </div>
      </div>
    </div>
  </main>

  <div class="vote" id="votezone">
    <div class="choix" id="choix"></div>
    <div class="qrcard" id="qrcard">
      <div class="q1">VOTEZ</div>
      <div id="qr"></div>
      <div class="q2">Scannez, ou <b id="voteurl">/0</b></div>
    </div>
  </div>

  <div id="fin"></div>

  <footer id="footer">
    <div class="path" id="path">Chemin parcouru : <b>—</b></div>
    <button class="next" id="next">Slide suivante →</button>
    <span class="hint"><kbd>Espace</kbd> / <kbd>Entrée</kbd></span>
  </footer>

<script src="/slides-data.js"></script>
<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const s=(qs.get('s')||'0');
  const data=(window.REX&&REX.slides[s])||null;
  const CAD=(window.REX&&REX.cadrageNodes)||[];

  function load(k,d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
  function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
  let chemin=load('rex_chemin',[]); let choix=load('rex_choix',[]); let round=parseInt(load('rex_round',1),10)||1;

  function renderPath(){ document.getElementById('path').innerHTML='Chemin parcouru : '+(chemin.length?chemin.map(x=>'<b>'+x+'</b>').join(' → '):'<b>—</b>'); }

  if(!data){ document.getElementById('titre').textContent='Slide "'+s+'" inconnue'; renderPath(); return; }

  // enregistre le passage
  if(chemin[chemin.length-1]!==data.node){ chemin.push(data.node); save('rex_chemin',chemin); }
  renderPath();

  // contexte (cadrages visités, changements de cap faits)
  const ctx={ cadrage: chemin.filter(x=>CAD.includes(x)).length, cap: choix.filter(c=>(c.tags||[]).includes('cap')).length };

  document.getElementById('code').textContent=data.node;
  document.getElementById('kicker').textContent=data.kicker||'';
  document.getElementById('titre').textContent=data.chapitre||('Slide '+s);
  document.getElementById('texte').textContent=data.texte||'';

  // jauges
  const G=REX.gauges, cur={budget:G.budget.start,tokens:G.tokens.start,sante:G.sante.start};
  choix.forEach(c=>{ if(c.impacts) for(const k in c.impacts) cur[k]=(cur[k]||0)+c.impacts[k]; });
  function row(key,cls,val,max){ const pct=max?Math.max(0,Math.min(100,val/max*100)):Math.max(0,Math.min(100,val));
    return `<div class="g ${cls}"><span class="nm">${G[key].label}</span><span class="track"><span class="fill" style="width:${pct}%"></span></span><span class="val">${val}${G[key].unit}${max?(' / '+max):''}</span></div>`; }
  document.getElementById('gauges').innerHTML=row('budget','b',cur.budget,G.budget.max)+row('tokens','t',cur.tokens,100)+row('sante','s',cur.sante,10);
  document.getElementById('explain').innerHTML=data.premiere
    ? "Trois jauges rythment l'aventure. Le <b>Budget</b> grimpe à chaque journée (20 j, au-delà c'est le crash). Les <b>Tokens</b> fondent avec l'IA. La <b>Santé mentale</b> encaisse. Certaines portes ne s'ouvrent qu'à ceux qui ont assez cadré." : "";
  document.getElementById('inv-cad').textContent=ctx.cadrage;
  document.getElementById('inv-cap').textContent=ctx.cap;

  const main=document.getElementById('main'), voteZone=document.getElementById('votezone'),
        footer=document.getElementById('footer'), finEl=document.getElementById('fin'),
        nextBtn=document.getElementById('next'), qEl=document.getElementById('question'), whyEl=document.getElementById('why');

  // reset : vide le chemin local et relance un nouveau round (porté ensuite par le QR)
  function resetAll(then){ try{ localStorage.removeItem('rex_chemin'); localStorage.removeItem('rex_choix'); localStorage.setItem('rex_round', JSON.stringify(round+1)); }catch(e){} then&&then(); }

  // ---------- navigation ----------
  function goTo(target, chosen){
    if(chosen){ choix.push({code:chosen.code,tags:chosen.tags||[],impacts:chosen.impacts||{}}); save('rex_choix',choix); }
    const tgt=REX.slides[target];
    const node=tgt?tgt.node:target;
    if(chemin[chemin.length-1]!==node){ chemin.push(node); save('rex_chemin',chemin); }
    location.href = tgt ? ('slide.html?s='+target) : 'recap.html';
  }

  // ---------- décision du mode ----------
  let forced=null;
  if(data.gate){ const g=data.gate(ctx); if(g) forced=g; }
  if(!forced && data.forcedTarget) forced={target:data.forcedTarget, why:data.forcedWhy};

  if(data.fin){
    // ---- écran de fin ----
    main.style.display='none'; voteZone.style.display='none'; footer.style.display='none';
    const klass = data.fin==='over'?'finover':(data.fin==='tada'?'fintada':'finbof');
    finEl.className=klass; finEl.style.display='flex';
    finEl.innerHTML =
      `<div class="emoji">${data.emoji||'🏁'}</div>`+
      `<div class="flabel">${data.chapitre||''}</div>`+
      `<h2 class="ftitre">${data.titreFin||''}</h2>`+
      `<p class="ftxt">${data.texte||''}</p>`+
      `<div class="acts">`+
        `<a class="btn primary" href="recap.html">Voir le parcours complet →</a>`+
        `<button class="btn" id="rejouer">↺ Rejouer depuis le début</button>`+
      `</div>`;
    document.getElementById('rejouer').addEventListener('click',()=>{ resetAll(()=>{ location.href='/start'; }); });
    document.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); location.href='recap.html'; }});
    return;
  }

  if(forced){
    // ---- slide forcée / condition : pas de vote ----
    voteZone.style.display='none';
    qEl.style.display='none';
    whyEl.style.display='block'; whyEl.textContent=forced.why||'';
    nextBtn.textContent=data.forcedLabel||'Continuer →';
    function act(){ goTo(forced.target, null); }
    nextBtn.addEventListener('click',act);
    document.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); }});
    return;
  }

  // ---------- slide à vote ----------
  qEl.textContent=data.question||'';
  const choixEl=document.getElementById('choix');
  data.choix.forEach((c,i)=>{ const d=document.createElement('div'); d.className='choice';
    d.innerHTML=`<div class="hd"><span class="bdg">${i+1}</span><span class="lab">${c.label}</span></div>`+
      `<div class="res"><span class="track"><span class="fill" id="fill-${i}"></span></span><span class="cnt" id="cnt-${i}">0</span></div>`;
    choixEl.appendChild(d); });
  const voteUrl=(REX.site||location.origin)+'/votant.html?s='+s+'&r='+round;
  document.getElementById('voteurl').textContent='votant.html?s='+s;
  if(window.QRCode){ try{ new QRCode(document.getElementById('qr'),{text:voteUrl,width:172,height:172,colorDark:'#141414',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.M}); }catch(e){} }

  let tally=data.choix.map(()=>0);
  function leader(){ let m=-1,idx=0; tally.forEach((v,i)=>{ if(v>m){m=v;idx=i;} }); return idx; }
  function refresh(){ const total=tally.reduce((a,b)=>a+b,0), lead=leader();
    data.choix.forEach((c,i)=>{ const pct=total?Math.round(tally[i]/total*100):0;
      document.getElementById('fill-'+i).style.width=pct+'%';
      document.getElementById('cnt-'+i).textContent=tally[i]+(total?('  '+pct+'%'):'');
      choixEl.children[i].classList.toggle('lead',total>0&&i===lead); });
    nextBtn.disabled = total===0;
    nextBtn.textContent = total ? ('Slide suivante → choix '+(lead+1)) : 'En attente de votes…';
    nextBtn.dataset.lead=lead; }
  function act(){ if(tally.reduce((a,b)=>a+b,0)===0) return; const lead=parseInt(nextBtn.dataset.lead||'0',10); const c=data.choix[lead]; goTo(c.target,c); }
  nextBtn.addEventListener('click',act);
  document.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); }});
  refresh();

  (async function(){
    try{
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
      const { getFirestore, collection, onSnapshot } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const app=initializeApp(REX.firebase); await signInAnonymously(getAuth(app));
      const db=getFirestore(app);
      const col=collection(db,'polls','slide-'+s,'rounds',String(round),'votes');
      onSnapshot(col, snap=>{ const t=data.choix.map(()=>0);
        snap.forEach(doc=>{ const i=Number(doc.data().choice); if(i>=0&&i<t.length) t[i]++; });
        tally=t; refresh(); });
    }catch(e){ console.warn('Firebase indispo',e); }
  })();
})();
</script>
</body>
</html>
