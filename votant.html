<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>REX héros · votez</title>
<style>
  :root{--paint:#f2c400;--sign-black:#141414;--navy:#0c1d38;--navy2:#122a4f;--txt:#f5f1e6;--muted:#b9c2d4;--ok:#58d98c}
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{min-height:100vh;color:var(--txt);font-family:"Arial Narrow","Roboto Condensed",Arial,system-ui,sans-serif;
    background:radial-gradient(120% 60% at 80% 0%,rgba(255,210,120,.2),rgba(0,0,0,0) 45%),linear-gradient(180deg,#0a1730,#122a4f 70%,#0c1d38);
    display:flex;flex-direction:column;padding:clamp(1rem,5vw,1.6rem)}
  .top{display:flex;align-items:center;gap:.5rem;margin-bottom:1rem}
  .ico{width:1.6em;height:1.6em;display:grid;place-items:center;color:var(--sign-black);background:var(--paint);border-radius:7px}
  .brand{font-weight:800;letter-spacing:.04em}
  .chip{margin-left:auto;background:rgba(242,196,0,.14);border:1px solid rgba(242,196,0,.5);color:var(--paint);border-radius:999px;padding:.2em .7em;font-weight:700;letter-spacing:.08em;font-size:.72rem}
  .pass{background:#f4f1e8;color:#16213a;border-radius:16px;padding:1rem 1.1rem;box-shadow:0 18px 50px rgba(0,0,0,.4)}
  .pass .k{font-size:.62rem;letter-spacing:.16em;color:#7c879c}
  .pass .code{font-weight:800;font-size:1.3rem;letter-spacing:.04em}
  .pass .ch{font-size:1.05rem;font-weight:700;margin-top:.2rem}
  h1{margin:1.2rem 0 .2rem;font-size:1.5rem;font-weight:800;line-height:1.05}
  .sub{color:var(--muted);margin:0 0 1rem;font-size:.95rem}
  .opts{display:flex;flex-direction:column;gap:.7rem}
  .opt{display:flex;align-items:center;gap:.7rem;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.16);
    color:var(--txt);border-radius:14px;padding:1rem;font-size:1.05rem;font-weight:700;text-align:left;cursor:pointer;transition:.15s}
  .opt .bdg{flex:0 0 auto;width:2em;height:2em;display:grid;place-items:center;border-radius:8px;background:var(--paint);color:var(--sign-black);font-weight:800}
  .opt:active{transform:scale(.99)}
  .opt.sel{border-color:var(--paint);background:rgba(242,196,0,.16)}
  .opt.sel::after{content:"✓";margin-left:auto;color:var(--ok);font-weight:800;font-size:1.3rem}
  .status{margin-top:1.1rem;text-align:center;font-size:1rem;color:var(--muted);min-height:1.4em}
  .status.ok{color:var(--ok);font-weight:700}
  .foot{margin-top:auto;padding-top:1.4rem;color:var(--muted);font-size:.78rem;text-align:center}
</style>
</head>
<body>
  <div class="top"><span class="ico">✈</span><span class="brand">REX HÉROS</span><span class="chip">4SHARE MORNING</span></div>
  <div class="pass">
    <div class="k">CARTE D'EMBARQUEMENT · VOTE</div>
    <div class="code" id="code">S0</div>
    <div class="ch" id="chapitre">—</div>
  </div>
  <h1 id="question">Faites votre choix</h1>
  <p class="sub">Touchez l'option qui doit l'emporter. Vous pouvez changer tant que le vote est ouvert.</p>
  <div class="opts" id="opts"></div>
  <div class="status" id="status">Connexion…</div>
  <div class="foot">Votre vote est anonyme.</div>

<script src="/slides-data.js?v=3"></script>
<script>
(function(){
  const qs=new URLSearchParams(location.search);
  const n=parseInt(qs.get('s')||'0',10);
  const r=parseInt(qs.get('r')||'1',10)||1;
  const data=(window.REX&&REX.slides[n])||null;
  const st=document.getElementById('status');
  if(!data){ document.getElementById('question').textContent='Vote indisponible'; st.textContent='Slide '+n+' inconnue.'; return; }
  document.getElementById('code').textContent=data.node;
  document.getElementById('chapitre').textContent=data.chapitre||'';
  document.getElementById('question').textContent=data.question||'Faites votre choix';

  const opts=document.getElementById('opts'); const btns=[];
  data.choix.forEach((c,i)=>{
    const b=document.createElement('button'); b.className='opt';
    b.innerHTML=`<span class="bdg">${i+1}</span><span>${c.label}</span>`;
    b.addEventListener('click',()=>vote(i)); opts.appendChild(b); btns.push(b);
  });

  let fdbRef=null, uid=null, setDocFn=null, docFn=null, pending=null, selected=-1;
  function mark(i){ selected=i; btns.forEach((b,j)=>b.classList.toggle('sel',j===i)); }

  async function vote(i){
    mark(i);
    if(!fdbRef||!uid){ pending=i; st.textContent='Connexion en cours…'; return; }
    try{
      await setDocFn(docFn(fdbRef, "polls","slide-"+n,"rounds",String(r),"votes", uid), { choice:i, at:Date.now() });
      st.textContent='Vote enregistré ✓'; st.className='status ok';
    }catch(e){ st.textContent="Échec de l'envoi, réessayez."; st.className='status'; console.warn(e); }
  }

  (async function(){
    try{
      const { initializeApp } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
      const { getAuth, signInAnonymously, onAuthStateChanged } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js");
      const { getFirestore, doc, setDoc } = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
      const app=initializeApp(REX.firebase); const auth=getAuth(app);
      docFn=doc; setDocFn=setDoc; fdbRef=getFirestore(app);
      onAuthStateChanged(auth, u=>{ if(u){ uid=u.uid; st.textContent='Prêt à voter'; if(pending!=null){ const p=pending; pending=null; vote(p);} } });
      await signInAnonymously(auth);
    }catch(e){ st.textContent='Connexion impossible (réseau ?)'; console.warn(e); }
  })();
})();
</script>
</body>
</html>
